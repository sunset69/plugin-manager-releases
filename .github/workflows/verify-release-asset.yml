name: verify-release-asset

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous HEAD + full download
        run: |
          URL="https://github.com/sunset69/plugin-manager-releases/releases/download/v1.0.2-market-sources/PluginManager-v1.0.2-arm64.apk"
          echo "== headers =="
          curl -sS -L -I "$URL" | grep -Ei '^HTTP|^content-length|^content-type'
          echo "== download =="
          curl -sS -L -o /tmp/app.apk -w "http_code=%{http_code}\nsize_download=%{size_download}\n" "$URL"
          echo "== file =="
          ls -l /tmp/app.apk
          echo "sha256=$(sha256sum /tmp/app.apk | cut -d' ' -f1)"
          echo "expected=B74527ACB56A0F48459F8228A6596ABF7D5D24F47C4E701B7DF133612D4AB91D"